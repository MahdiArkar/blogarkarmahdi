<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAHDIARKAR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Aref+Ruqaa:wght@700&family=Bricolage+Grotesque:wght@700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f7fe;--surface:#fff;--line:#d6e0f3;--text:#0e1a33;--muted:#53617f;
  --accent:#2563eb;--ink:#fff;--tag:#0b7d9c;--glow:rgba(59,130,246,.18);--dot:rgba(37,99,235,.16);--ok:#15803d;
  --sans:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --display:"Aref Ruqaa","Vazirmatn",Tahoma,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#070b16;--surface:#0d1426;--line:#1c2a4a;--text:#e6edfb;--muted:#8e9bb8;--accent:#4d8dff;--ink:#06102a;--tag:#38bdf8;--glow:rgba(59,130,246,.28);--dot:rgba(120,160,255,.14);--ok:#4ade80}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#070b16;--surface:#0d1426;--line:#1c2a4a;--text:#e6edfb;--muted:#8e9bb8;--accent:#4d8dff;--ink:#06102a;--tag:#38bdf8;--glow:rgba(59,130,246,.28);--dot:rgba(120,160,255,.14);--ok:#4ade80}
:root[lang="en"]{--display:"Bricolage Grotesque","Vazirmatn",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;color:var(--text);font:400 1.0625rem/2 var(--sans);-webkit-text-size-adjust:100%;
  background:radial-gradient(50rem 26rem at 85% -8%,var(--glow),transparent 65%),radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/24px 24px,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.6rem 1.4rem;flex-wrap:wrap;padding-top:.55rem;padding-bottom:.55rem}
.brand{font:700 1.55rem/1.4 var(--display);color:var(--text)}
.brand::before{content:"$ ";font-family:var(--mono);font-size:1.1rem;color:var(--accent);direction:ltr;unicode-bidi:isolate}
nav{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center}
nav a{font:400 .9rem/1.8 var(--mono);color:var(--muted);border-bottom:2px solid transparent;direction:ltr}
nav a:hover{color:var(--text)}
nav a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.ctl{font:600 .82rem/1.6 var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.1rem .7rem;cursor:pointer}
.ctl:hover{border-color:var(--accent)}
main{padding:2.5rem 0 4rem;min-height:60vh}
h1,h2,h3{line-height:1.5;margin:0}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:2.5rem;align-items:center;padding:1rem 0 3rem}
.hero h1{font:700 clamp(3rem,9vw,5.6rem)/1.3 var(--display)}
.who{color:var(--accent);font-weight:600;margin:.2rem 0}
.hero p{color:var(--muted);margin:.4rem 0 1.5rem;max-width:30rem}
.btn{display:inline-block;background:var(--accent);color:var(--ink);font:600 1rem/2 var(--sans);padding:.3rem 1.4rem;border-radius:8px;border:0;cursor:pointer;box-shadow:0 8px 24px -10px var(--accent)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);box-shadow:none;margin-inline-start:.6rem}
.btn.ghost:hover{border-color:var(--accent)}
.term{direction:ltr;background:#08101f;border:1px solid #21386b;border-radius:12px;overflow:hidden;font:400 .93rem/1.9 var(--mono);box-shadow:0 0 0 1px rgba(77,141,255,.15),0 26px 60px -26px rgba(59,130,246,.75);color:#d3def6}
.term .bar{display:flex;gap:.4rem;align-items:center;padding:.55rem .9rem;border-bottom:1px solid #21386b;color:#8da0c9;font-size:.78rem}
.term .bar i{width:.6rem;height:.6rem;border-radius:50%;background:#2c4682}
.term .bar span{margin-inline-start:.6rem}
.term .bar em{margin-inline-start:auto;font-style:normal;color:#4ade80}
.term pre{margin:0;padding:1rem 1.2rem;overflow-x:auto}
.k{color:#7fb0ff}.s{color:#f0c674}.d{color:#6f82ad}
.line{display:block;opacity:0;animation:in .01s forwards}
.line:nth-child(1){animation-delay:.2s}.line:nth-child(2){animation-delay:.6s}.line:nth-child(3){animation-delay:1s}.line:nth-child(4){animation-delay:1.4s}.line:nth-child(5){animation-delay:1.8s}.line:nth-child(6){animation-delay:2.2s}
.caret{display:inline-block;width:.55rem;height:1.1em;background:#4d8dff;vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes in{to{opacity:1}}@keyframes blink{50%{opacity:0}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:.5rem;margin:2.2rem 0 .5rem}
.sec-h h2{font-size:1.35rem;font-weight:800}
.sec-h a{color:var(--accent);font-size:.95rem}
.post{display:grid;grid-template-columns:8.5rem 1fr;gap:1.2rem;padding:1.4rem 0;border-bottom:1px solid var(--line)}
.post .meta{color:var(--muted);font-size:.9rem;line-height:1.8}
.post h3{font-size:1.2rem;font-weight:600}
.post:hover h3{color:var(--accent)}
.post p{margin:.2rem 0 0;color:var(--muted);font-size:.98rem;line-height:1.9}
.tag{color:var(--tag);font-size:.88rem}
.projs{display:grid;gap:1rem;margin-top:1rem}
.proj{padding:1rem 1.3rem;border:1px solid var(--line);border-inline-start:3px solid var(--accent);background:var(--surface);border-radius:8px}
.proj h3{font-size:1.1rem}
.proj p{margin:.2rem 0 .5rem;color:var(--muted);font-size:.95rem;line-height:1.9}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;direction:ltr}
.chips span{font:400 .78rem/1.7 var(--mono);color:var(--tag);border:1px solid var(--line);border-radius:5px;padding:0 .5rem}
.cta{margin-top:1.2rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin-top:1rem}
.cat{border:1px solid var(--line);background:var(--surface);padding:1rem 1.2rem;border-radius:8px}
.cat:hover{border-color:var(--accent)}
.cat b{display:block;font-size:1.1rem}
.cat small{color:var(--muted);font-size:.9rem;line-height:1.8;display:block}
.page{max-width:40rem}
.page h1{font:700 clamp(2.2rem,6vw,3.2rem)/1.5 var(--display);margin-bottom:1rem}
.page h2{font-size:1.25rem;margin:2rem 0 .3rem}
.page p{margin:.6rem 0}
.info{color:var(--muted);font-size:.92rem}
.in{color:var(--accent);border-bottom:1px solid var(--line)}
.page pre{direction:ltr;text-align:left;background:#08101f;color:#d3def6;border:1px solid #21386b;border-radius:8px;padding:1rem 1.2rem;overflow-x:auto;font:400 .92rem/1.8 var(--mono)}
.page code{font-family:var(--mono);font-size:.92em;background:var(--surface);border:1px solid var(--line);padding:.02rem .35rem;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.page pre code{background:none;border:0;padding:0}
form{display:grid;gap:1rem;margin-top:1rem}
label{display:grid;gap:.2rem;font-weight:600;font-size:.95rem}
input,textarea{font:400 1rem/1.8 var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem;width:100%}
textarea{min-height:9rem;resize:vertical}
.status{min-height:1.6rem;color:var(--ok);font-size:.95rem}
.links{display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.5rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;padding:1.5rem 0}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
footer .wrap span{display:flex;gap:1.2rem;flex-wrap:wrap}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:1.5rem}
  .post{grid-template-columns:1fr;gap:.2rem}
  main{padding-top:1.5rem}
}
@media (prefers-reduced-motion:reduce){.line{animation:none;opacity:1}.caret{animation:none}}

:root[data-theme="dark"] .corner{opacity:.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .corner{opacity:.5}}
main,footer{position:relative;z-index:1}
.welcome{font:700 clamp(1.35rem,3.4vw,1.9rem)/1.6 var(--display);margin-bottom:.2rem}
.nm{font-family:var(--mono);font-size:.82em;letter-spacing:.08em;color:var(--accent);direction:ltr;unicode-bidi:isolate}
@media (max-width:760px){.corner{opacity:.3;width:92vw}}
.c-layout{display:grid;grid-template-columns:minmax(0,26rem) minmax(0,1fr);gap:2rem;align-items:start;margin-top:1rem}
.c-calc{direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem;box-shadow:0 26px 60px -34px var(--accent)}
.c-screen{background:#08101f;color:#d3def6;border:1px solid #21386b;border-radius:10px;padding:.7rem 1rem;margin-bottom:.9rem;text-align:right;min-height:6.2rem;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.c-ex{font:400 1.05rem/1.6 var(--mono);color:#8da0c9;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.c-rs{font:600 2rem/1.4 var(--mono);overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-height:2.8rem}
.c-rs.err{color:#fb923c;font-size:1.2rem}
.c-sci,.c-main{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.c-sci{margin-bottom:.5rem}
.c-k{min-height:3rem;border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 7%,var(--surface));color:var(--text);border-radius:10px;font:600 1.15rem/1 var(--sans);cursor:pointer;touch-action:manipulation;user-select:none}
.c-k:hover{border-color:var(--accent)}
.c-k:active{transform:scale(.97)}
.c-sci .c-k{min-height:2.5rem;font:400 .92rem/1 var(--mono);color:var(--muted)}
.c-k.op{color:var(--accent);background:var(--surface)}
.c-k.eq{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.c-k.z{grid-column:span 2}
.c-k.mode{color:var(--accent);font-weight:700}
.c-hist{min-width:0}
.c-hh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.c-hh h2{font-size:1.15rem}
.c-hist ul{list-style:none;margin:0;padding:0}
.c-hist li button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:.6rem .2rem;cursor:pointer;direction:ltr;font-family:inherit}
.c-hist li button:hover{color:var(--accent)}

@media (max-width:700px){.b-stage{min-height:38rem;background-position:center 35%}}

.b-card{position:relative;width:100%;max-width:26rem;padding:1.6rem 1.5rem 1.3rem;color:#f4efe2;background:rgba(14,14,14,.58);border:1px solid #3a2f17;border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 30px 70px -30px #000;transition:opacity .4s ease,transform .4s ease,visibility .4s;animation:brise .7s cubic-bezier(.2,.7,.2,1) backwards}
.b-stage.peek .b-card{opacity:0;visibility:hidden;transform:translateY(14px)}
.b-peek{position:absolute;bottom:1rem;inset-inline-end:1rem;z-index:2;background:rgba(10,10,10,.55);backdrop-filter:blur(8px);color:#f4efe2;border:1px solid #6b5522;border-radius:999px;padding:.1rem 1rem;font:600 .85rem/2 var(--sans);cursor:pointer;transition:border-color .25s,color .25s}
.b-peek:hover{border-color:#e6c677;color:#e6c677}
.b-peek:focus-visible{outline:2px solid #e6c677;outline-offset:3px}
.b-card.sw .b-h,.b-card.sw .b-f,.b-card.sw .b-row,.b-card.sw .b-go,.b-card.sw .b-str{animation:brise .45s cubic-bezier(.2,.7,.2,1) both}
.b-card.sw .b-f:nth-of-type(2){animation-delay:.05s}.b-card.sw .b-f:nth-of-type(3){animation-delay:.1s}
.b-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #2e2e2e;margin-bottom:1.1rem}

 if(deg)s=s.replace(/(sin|cos|tan)\(/g,"$1D(");
 return s;
}
function scope(){var r=Math.PI/180;return{ans:last,sinD:function(x){return Math.sin(x*r)},cosD:function(x){return Math.cos(x*r)},tanD:function(x){return Math.tan(x*r)}}}
function calc(s){var v=math.evaluate(conv(s),scope());if(typeof v==="function"||v===undefined||(typeof v==="object"&&v!==null&&!math.isComplex(v)))throw new Error("bad");if(typeof v==="number"&&!isFinite(v))throw new Error("bad");return v}
function fmt(v){return math.format(v,{precision:12}).replace(/\s/g,"")}
function preview(){res="";if(!/[+\-×÷−*\/^!%(]|sin|cos|tan|ln|log|√|π|e|ans/.test(expr.replace(/^-/,"")))return;try{res=fmt(calc(expr))}catch(e){res=""}}
function paint(){
 var ex=document.getElementById("cex"),rs=document.getElementById("crs");if(!ex)return;
 ex.textContent=done?prev+" =":(expr||"0");rs.className="c-rs";rs.textContent=done?expr:res;ex.scrollLeft=ex.scrollWidth;
}
function setErr(){var rs=document.getElementById("crs");rs.className="c-rs err";rs.textContent=t("err")}
function renderHist(){
 var l=document.getElementById("chl");if(!l)return;
 l.innerHTML=hist.map(function(h,i){return '<li><button type="button" data-ci="'+i+'"><div class="e">'+h.e+'</div><div class="r">= '+h.r+'</div></button></li>'}).join("");
 document.getElementById("che").textContent=hist.length?"":t("empty");
}
var FIRST=/^[0-9.(πe]$|^(sin|cos|tan|ln|log|√)\($|^ans$|^1\/\($/;
function press(k){
 if(k==="mode"){deg=!deg;document.getElementById("cmd").textContent=deg?"DEG":"RAD";preview();paint();return}
 if(k==="ac"){expr="";res="";prev="";done=false;paint();return}
 if(k==="bs"){done=false;expr=expr.replace(/(ans|sin\(|cos\(|tan\(|ln\(|log\(|√\()$|[^]$/,"");preview();paint();return}
 if(k==="eq"){if(!expr||done)return;try{var v=calc(expr),s=fmt(v);hist.unshift({e:expr,r:s});hist=hist.slice(0,20);try{localStorage.setItem("hist",JSON.stringify(hist))}catch(x){}
   prev=expr;expr=s;res="";done=true;if(typeof v==="number")last=v;paint();renderHist()}catch(e){setErr()}return}
 if(done){if(FIRST.test(k)){expr=""}done=false}
 if(k==="ans"&&/[0-9.)πe]$/.test(expr))expr+="×";
 expr+=k;preview();paint();
}
function init(){
 if(!window.math){var rs=document.getElementById("crs");if(rs)rs.textContent="Math.js failed to load";return}
 paint();renderHist();
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b||!document.getElementById("cc"))return;
 if(b.dataset.ck)press(b.dataset.ck);
 else if(b.dataset.ci!==undefined){expr=hist[+b.dataset.ci].r;done=false;res="";paint()}
 else if(b.id==="chc"){hist=[];try{localStorage.removeItem("hist")}catch(x){}renderHist()}
});
document.addEventListener("keydown",function(e){
 if(!document.getElementById("cc")||e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key,m={"*":"×","/":"÷","-":"−"};
 if(/^[0-9.+()^!]$/.test(k))press(k);else if(m[k])press(m[k]);else if(k==="%")press("/100");
 else if(k==="Enter"||k==="="){e.preventDefault();press("eq")}else if(k==="Backspace")press("bs");else if(k==="Escape")press("ac");else return;
 if(k==="/")e.preventDefault();
});
return{html:html,init:init};
})();

projects:function(){return '<div class="page"><h1>'+t("projH")+'</h1><p>'+t("projI")+'</p></div><div class="projs" style="max-width:40rem">'+PROJ.map(proj).join("")+'</div>'+siteBtn()},
about:function(){return '<div class="page"><h1>'+t("aboutH")+'</h1><p>'+t("a1")+'</p><p>'+t("a2")+'</p><h2>'+t("meH")+'</h2><p>'+t("me")+'</p><h2>'+t("pathH")+'</h2><ol class="tl">'+t("tl").map(function(i){return '<li><b>'+i[0]+'</b><span>'+i[1]+'</span></li>'}).join("")+'</ol><h2>'+t("goalH")+'</h2><p>'+t("goal")+'</p><div class="links">'+ext(SITE,t("site"))+ext(IG,t("ig")+': mahdiarkar.dev')+'<a class="in" href="#/contact">'+t("contactH")+'</a></div></div>'},
contact:function(){return '<div class="page"><h1>'+t("contactH")+'</h1><p>'+t("ci")+'</p><form id="cf"><label>'+t("fn")+'<input name="n" required autocomplete="name"></label><label>'+t("fe")+'<input name="e" type="email" required autocomplete="email"></label><label>'+t("fm")+'<textarea name="m" required></textarea></label><div><button class="btn" type="submit">'+t("send")+'</button></div><div class="status" id="st" role="status"></div></form><p class="info">'+t("direct")+' <span dir="ltr">'+EMAIL+'</span></p><div class="links">'+ext("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(EMAIL),t("gm"))+ext("mailto:"+EMAIL,t("ma"))+'</div></div>'},
calculator:function(){return CALC.html()},
bmw:function(){return BMW.html()},
ai:function(){return AI.html()},
nf:function(){return '<div class="page"><h1>'+t("nf")+'</h1><p>'+t("nfT")+' <a class="in" href="#/">'+t("home")+'</a></p></div>'}};
function bind(){
 var f=document.getElementById("cf");
 if(f)f.addEventListener("submit",function(e){e.preventDefault();var d=new FormData(f);
  var a=document.createElement("a");a.href=gmail(d.get("n"),d.get("e"),d.get("m"));a.target="_blank";a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();document.getElementById("st").textContent=t("ok")});
}
function isDark(){var a=document.documentElement.getAttribute("data-theme");return a?a==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches}
function chrome(){
 var h=document.documentElement;h.lang=L;h.dir=L==="fa"?"rtl":"ltr";
 document.getElementById("brand").textContent=t("brand");
 document.getElementById("nav").innerHTML='<a href="#/" data-r="home">index</a><a href="#/posts" data-r="posts">blog.md</a><a href="#/projects" data-r="projects">projects/</a><a href="#/about" data-r="about">about.md</a><a href="#/contact" data-r="contact">contact.sh</a><button class="ctl" id="lg" type="button">'+t("other")+'</button><button class="ctl" id="th" type="button">'+(isDark()?t("light"):t("dark"))+'</button>';
 document.getElementById("foot").innerHTML='<span>'+t("foot")+'</span><span>'+ext(SITE,t("site"))+ext(IG,t("ig"))+'</span>';
 document.getElementById("lg").onclick=function(){L=L==="fa"?"en":"fa";try{localStorage.setItem("lang",L)}catch(e){}route()};
 document.getElementById("th").onclick=function(){var m=isDark()?"light":"dark";h.setAttribute("data-theme",m);try{localStorage.setItem("th",m)}catch(e){}chrome();mark()};
}
function mark(){var r=(location.hash||"#/").replace(/^#\/?/,"").split("/")[0]||"home";var k=r==="post"||r==="category"||r==="categories"?"posts":r==="calculator"||r==="bmw"||r==="ai"?"projects":r;
 document.querySelectorAll("#nav a").forEach(function(l){l.removeAttribute("aria-current");if(l.dataset.r===k)l.setAttribute("aria-current","page")})}
function route(){
 var h=(location.hash||"#/").replace(/^#\/?/,"").split("/"),r=h[0]||"home";
 chrome();document.title=t("brand")+" | "+(L==="fa"?"مهدی ارکار":"Mahdi Arkar");
 document.getElementById("app").innerHTML=(V[r]||V.nf)(h[1]);
 mark();bind();if(r==="calculator")CALC.init();window.scrollTo(0,0);
}
try{var st=localStorage.getItem("th");if(st==="light"||st==="dark")document.documentElement.setAttribute("data-theme",st)}catch(e){}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
